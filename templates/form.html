<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rain Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header with Language Switcher and Logo -->
        <div class="header">
            <div class="language-switcher">
                <label for="languageSelect" id="languageSelectLabel">Select Language:</label>
                <select id="languageSelect" onchange="changeLanguage()">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>
            <img src="{{ url_for('static', filename='images/newlogo.png') }}" alt="Logo" class="logo">
        </div>

        <!-- Form Title -->
        <h1 id="formTitle">Rain Service</h1>

        <!-- Form -->
        <form id="dataEntryForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="carNumber" id="carNumberLabel">Car Number:</label>
                <input type="text" id="carNumber" name="carNumber" required>
            </div>

            <div class="form-group">
                <label for="carType" id="carTypeLabel">Car Type:</label>
                <input type="text" id="carType" name="carType" required>
            </div>

            <div class="form-group">
                <label for="carCode" id="carCodeLabel">Car Code:</label>
                <input type="text" id="carCode" name="carCode" required>
            </div>

            <div class="form-group">
                <label for="inspectorId" id="inspectorIdLabel">Inspector ID:</label>
                <input type="text" id="inspectorId" name="inspectorId" required>
            </div>

            <div class="form-group">
                <label for="pullArea" id="pullAreaLabel">Pull Area:</label>
                <input type="text" id="pullArea" name="pullArea" list="areasList" required>
            </div>

            <div class="form-group">
                <label for="dischargeArea" id="dischargeAreaLabel">Discharge Area:</label>
                <input type="text" id="dischargeArea" name="dischargeArea" list="areasList" required>
            </div>

            <datalist id="areasList">
                <option value="النباعة">
                <option value="القاسمية">
                <option value="المجاز 1">
                <option value="المجاز 2">
                <option value="المجاز 3">
                <option value="الخالدية">
                <option value="الغبيبة">
                <option value="أم خنور">
                <option value="اليرموك">
                <option value="المنصورة">
                <option value="الشهامة">
                <option value="الشويهين">
                <option value="السويحات">
                <option value="الناصرية">
                <option value="الطلاع">
                <option value="الحزانة">
                <option value="الفلج">
                <option value="السور">
                <option value="المريجة">
                <option value="الرملة الشرقية">
                <option value="الرملة الغربية">
                <option value="البحيرة">
                <option value="القليعات">
                <option value="الجرينة">
                <option value="القرائن 1">
                <option value="القرائن 2">
                <option value="القرائن 3">
                <option value="القرائن 4">
                <option value="القرائن 5">
                <option value="القرائن 6">
                <option value="القرائن 7">
                <option value="المصلى">
                <option value="النوف 1">
                <option value="النوف 2">
                <option value="النوف 3">
                <option value="النوف 4">
                <option value="النوف 5">
                <option value="المويهات">
                <option value="النهضة">
                <option value="النهدة">
                <option value="التعاون">
                <option value="السبخة">
                <option value="حلوان">
                <option value="الصناعية 1">
                <option value="الصناعية 2">
                <option value="الصناعية 3">
                <option value="الصناعية 4">
                <option value="الصناعية 5">
                <option value="الصناعية 6">
                <option value="الصناعية 7">
                <option value="الصناعية 8">
                <option value="الصناعية 9">
                <option value="الصناعية 10">
                <option value="الصناعية 11">
                <option value="الصناعية 12">
                <option value="الصناعية 13">
                <option value="الصناعية 14">
                <option value="الصناعية 15">
                <option value="الصناعية 16">
                <option value="الصناعية 17">
                <option value="الصناعية 18">
                <option value="خورفكان">
                <option value="كلباء">
                <option value="دبا الحصن">
                <option value="الحمرية">
                <option value="الزبارة">
                <option value="المديفي">
                <option value="البردي">
                <option value="الذيد">
                <option value="المدام">
                <option value="مليحة">
                <option value="فلج المعلا">
                <option value="البديع">
                <option value="وشاح">
                <option value="الثميد">
                <option value="الفلي">
                <option value="الرفيعة">
                <option value="مدينة الشارقة المستدامة">
                <option value="مدينة الشارقة الجامعية">
                <option value="الزاهية">
                <option value="التلال">
                <option value="الشرقان">
                <option value="مويلح">
                <option value="الصجعة">
                <option value="السجع">
                <option value="الفشت">
                <option value="البوطينة">
                <option value="المشرف">
                <option value="القليعة">
                <option value="الرقة">
                <option value="السيوح 1">
                <option value="السيوح 2">
                <option value="السيوح 3">
                <option value="السيوح 4">
                <option value="السيوح 5">
                <option value="السيوح 6">
                <option value="السيوح 7">
                <option value="السيوح 8">
                <option value="السيوح 9">
                <option value="السيوح 10">
                <option value="السيوح 11">
                <option value="السيوح 12">
                <option value="السيوح 13">
                <option value="السيوح 14">
                <option value="السيوح 15">
                <option value="البحيص">
                <option value="وادي الحلو">
                <option value="طوي السامان">
                <option value="الفرات">
                <option value="أخرى">
            </datalist>

            <div class="form-group">
                <label for="notes" id="notesLabel">Notes:</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="location" id="locationLabel">Location:</label>
                <input type="text" id="location" name="location" readonly>
                <button type="button" id="getLocationButton" onclick="getLocation()">Get Location</button>
            </div>

            <div class="form-group">
                <label for="photo" id="photoLabel">Photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*">
                <button type="button" onclick="openCamera()">Take Photo</button>
            </div>


            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" id="submitButton">Submit</button>
            </div>
        </form>

        <!-- Success Message -->
        <div id="thankYouMessage" style="display: none;">
            <p>Your Reference Number: <span id="refNumber" style="font-weight: bold; color: green;"></span></p>
            <div>
                <a id="whatsappLink" href="#" target="_blank">
                    <button class="btn-secondary">Share on WhatsApp</button>
                </a>
                <a id="telegramLink" href="#" target="_blank">
                    <button class="btn-secondary">Share on Telegram</button>
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
