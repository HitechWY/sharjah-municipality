<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rain Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header with Language Switcher and Logo -->
        <div class="header">
            <div class="language-switcher">
                <label for="languageSelect" id="languageSelectLabel">Select Language:</label>
                <select id="languageSelect" onchange="changeLanguage()">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>
            <img src="{{ url_for('static', filename='images/newlogo.png') }}" alt="Logo" class="logo">
        </div>

        <!-- Form Title -->
        <h1 id="formTitle">Rain Service</h1>

        <!-- Form -->
        <form id="dataEntryForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="carNumber" id="carNumberLabel">Car Number:</label>
                <input type="text" id="carNumber" name="carNumber" required>
            </div>

            <div class="form-group">
                <label for="carType" id="carTypeLabel">Car Type:</label>
                <input type="text" id="carType" name="carType" required>
            </div>

            <div class="form-group">
                <label for="carCode" id="carCodeLabel">Car Code:</label>
                <input type="text" id="carCode" name="carCode" required>
            </div>

            <div class="form-group">
                <label for="inspectorId" id="inspectorIdLabel">Inspector ID:</label>
                <input type="text" id="inspectorId" name="inspectorId" required>
            </div>

            <div class="form-group">
                <label for="pullArea" id="pullAreaLabel">Pull Area:</label>
                <input type="text" id="pullArea" name="pullArea" list="areasList" required>
            </div>

            <div class="form-group">
                <label for="dischargeArea" id="dischargeAreaLabel">Discharge Area:</label>
                <input type="text" id="dischargeArea" name="dischargeArea" list="areasList" required>
            </div>

            <datalist id="areasList">

                <option value="القاسمية - Al Qasimia">
                <option value="المجاز 1 - Al Majaz 1">
                <option value="المجاز 2 - Al Majaz 2">
                <option value="المجاز 3 - Al Majaz 3">
                <option value="الخالدية - Al Khalidiyah">

                <option value="القرائن 6 - Al Qarayen 6">

                <option value="المصلى - Al Musalla">

                <option value="حلوان - Halwan">
                <option value="الصناعية 1 - Industrial Area 1">

                <option value="الصناعية 3 - Industrial Area 3">

                <option value="الصناعية 7 - Industrial Area 7">
                <option value="الصناعية 8 - Industrial Area 8">
                <option value="الصناعية 9 - Industrial Area 9">
                <option value="الصناعية 10 - Industrial Area 10">

                <option value="أخرى - Other">
            </datalist>

            <div class="form-group">
                <label for="notes" id="notesLabel">Notes:</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="location" id="locationLabel">Location:</label>
                <input type="text" id="location" name="location" readonly>
                <button type="button" id="getLocationButton" onclick="getLocation()">Get Location</button>
            </div>

            <div class="form-group">
                <label for="photo" id="photoLabel">Photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*">
                <button type="button" onclick="openCamera()">Take Photo</button>
            </div>


            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" id="submitButton">Submit</button>
            </div>
        </form>

        <!-- Success Message -->
        <div id="thankYouMessage" style="display: none;">
            <p>Your Reference Number: <span id="refNumber" style="font-weight: bold; color: green;"></span></p>
            <div>
                <a id="whatsappLink" href="#" target="_blank">
                    <button class="btn-secondary">Share on WhatsApp</button>
                </a>
                <a id="telegramLink" href="#" target="_blank">
                    <button class="btn-secondary">Share on Telegram</button>
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
